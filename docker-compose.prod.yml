services:
  backend:
    build: ./apps/backend
    container_name: coffee_backend
    ports:
      # Bound to the server's loopback on purpose. This was "8000:80", which
      # published the raw API (and /docs) on the public interface, bypassing the
      # TLS-terminating nginx and letting clients talk to the app while ignoring
      # the X-Forwarded-For the proxies set. Public traffic reaches the API only
      # through nginx's `location /api`.
      - "127.0.0.1:8000:80"
    volumes:
      - ./data:/data
      # Admin-uploaded product photos; without a volume they vanished on every rebuild.
      - ./data/uploads:/app/static/uploads
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/coffee.db
      # Only the nginx containers on the pinned private network below may assert a
      # client IP via X-Forwarded-For. This replaces `*`, which let any peer spoof
      # its address and thereby mint an unlimited number of login rate-limit
      # buckets (and forge the IP stored in LoginLog).
      - FORWARDED_ALLOW_IPS=172.28.0.0/16
      # SECURITY: this must be replaced with a real secret before deploying.
      # `***REMOVED-PURGED***` is a scrubbed placeholder, and because it was
      # committed the original value must be treated as leaked: rotate it, set it
      # out-of-band (e.g. an untracked .env / secret store), and note that
      # replacing it invalidates every issued JWT (all users must log in again).
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in the environment, do not commit it}
    networks:
      - coffee-edge
    restart: always

  student:
    build:
      context: .
      dockerfile: apps/frontend/Student/Dockerfile
    container_name: coffee_student
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro # 映射证书路径
    depends_on:
      - backend
    networks:
      - coffee-edge
    restart: always

  admin:
    build:
      context: .
      dockerfile: apps/frontend/Admin/Dockerfile
    container_name: coffee_admin
    ports:
      - "8080:443" # 外部 8080 访问内部 443 SSL
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - coffee-edge
    restart: always

  barista:
    build:
      context: .
      dockerfile: apps/frontend/Barista/Dockerfile
    container_name: coffee_barista
    ports:
      - "8081:443" # 外部 8081 访问内部 443 SSL
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - coffee-edge
    restart: always

networks:
  # Pinned so FORWARDED_ALLOW_IPS above can name a concrete, stable range instead
  # of trusting every source.
  coffee-edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
