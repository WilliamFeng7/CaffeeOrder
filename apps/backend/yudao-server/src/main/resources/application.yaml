server:
  port: 48080
spring:
  application:
    name: otia-cafe
  profiles:
    default: local
  main:
    allow-circular-references: true
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:otia_cafe}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: ${MYSQL_USER:otia}
          password: ${MYSQL_PASSWORD:otia_local}
          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 1h
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: cn.iocoder.yudao.module.*.dal.dataobject
mybatis-plus-join:
  banner: false
springdoc:
  api-docs:
    # 默认不公开接口文档；仅本地 dev 显式开启。
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
yudao:
  info:
    version: 1.0.0
    base-package: cn.iocoder.yudao
  web:
    admin-ui:
      url: http://localhost:8080
    cors:
      allowed-origins: []
  tenant:
    enable: false
  captcha:
    enable: false
  demo: false
  security:
    mock-enable: false
    password-encoder-length: 12
    permit-all-urls:
      - /static/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
  swagger:
    title: OTIA Café API
    description: OTIA Café 学生端、咖啡师端与管理端接口
    version: 1.0.0
    url: http://localhost:8080
    email: ''
    license: MIT
    license-url: https://opensource.org/licenses/MIT
  access-log:
    enable: false
cafe:
  auth:
    dev-login-enabled: false
    password-login-enabled: false
    bootstrap-student-no: ${OTIA_STUDENT_INITIAL_NO:}
    bootstrap-student-name: ${OTIA_STUDENT_INITIAL_NAME:测试学生}
    bootstrap-student-password: ${OTIA_STUDENT_INITIAL_PASSWORD:}
  card:
    mock-enabled: false
    default-balance: 50000
  order:
    max-cups: 10
    payment-timeout-seconds: 180
  dingtalk:
    corp-id: ${DINGTALK_CORP_ID:}
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    student-no-field: ${DINGTALK_STUDENT_NO_FIELD:job_number}
knife4j:
  enable: false
