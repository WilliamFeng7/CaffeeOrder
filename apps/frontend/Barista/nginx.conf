server {
    listen 443 ssl;
    server_name fengweiqin.com;
    
    # 如果用户用 http 访问 https 端口(8081)，自动重定向到 https
    error_page 497 https://$host:8081$request_uri;

    ssl_certificate /etc/nginx/certs/fengweiqin.com.pem;
    ssl_certificate_key /etc/nginx/certs/fengweiqin.com.key;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Product images are served by the FastAPI container. A KDS ticket shows the
    # drink photo, so without this the image request fell through to index.html and
    # every card had a broken picture in production.
    location /static {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /api {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}