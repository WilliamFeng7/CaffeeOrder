<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Viewport config for mobile optimization (No Zoom) -->
  <!-- 视口配置: 禁止缩放，适配移动端 -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OTIA Café</title>

  <!-- Add to Home Screen on iPad/iPhone: full screen without Safari's toolbars,
       back-swipe or pull-to-refresh (the kiosk set-up) -->
  <!-- 添加到主屏幕后全屏运行: 没有 Safari 工具栏、边缘返回手势和下拉刷新 -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OTIA Café" />
  <meta name="theme-color" content="#F2F7F5" />
  <meta name="format-detection" content="telephone=no" />

  <!-- No web fonts: text uses the system fonts (SF / PingFang on iPad) and icons
       are inline SVG, so nothing depends on Google Fonts being reachable. -->

</head>

<body>
  <!-- App Mount Point -->
  <!-- Vue 应用挂载点 -->
  <div id="app"></div>

  <!-- Main Entry Script -->
  <!-- 入口脚本 -->
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
