server {
    listen 80;
    server_name your_domain.com; # 替换成你的域名或 IP
    return 301 https://$host$request_uri; # 强制 HTTP 转 HTTPS
}

server {
    listen 443 ssl;
    server_name your_domain.com;

    ssl_certificate /etc/nginx/certs/server.crt;    # 证书路径（容器内路径）
    ssl_certificate_key /etc/nginx/certs/server.key; # 密钥路径（容器内路径）

    # 1. 学生端 (Student) - 根路径
    location / {
        proxy_pass http://student:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. 管理端 (Admin)
    location /admin {
        proxy_pass http://admin:80; # 注意：这里转发给内部 admin 服务的 80 端口
        proxy_set_header Host $host;
    }

    # 3. 咖啡师端 (Barista)
    location /barista {
        proxy_pass http://barista:80;
        proxy_set_header Host $host;
    }

    # 4. 后端接口 (Backend)
    location /api {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
    }
}