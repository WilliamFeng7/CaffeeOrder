# 仅供本地开发。生产部署方案另定。
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-otia_local_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-otia_cafe}
      MYSQL_USER: ${MYSQL_USER:-otia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-otia_local}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--default-time-zone=+08:00"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
  redis_data:
