services:
  backend:
    build: ./apps/backend
    container_name: coffee_backend
    ports:
      - "8000:80"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/coffee.db
      - FORWARDED_ALLOW_IPS=*
    restart: always

  student:
    build:
      context: .
      dockerfile: apps/frontend/Student/Dockerfile
    container_name: coffee_student
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: always

  admin:
    build:
      context: .
      dockerfile: apps/frontend/Admin/Dockerfile
    container_name: coffee_admin
    ports:
      - "8080:443"
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: always

  barista:
    build:
      context: .
      dockerfile: apps/frontend/Barista/Dockerfile
    container_name: coffee_barista
    ports:
      - "8081:443"
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: always
